# البوّابة: لا يُدمَج في main ولا تُبنى حزمة إلا بعد المرور من هنا.
#
# الغرض ليس «تشغيل الاختبارات» — فهي تُشغَّل محلياً أصلاً — بل أن يكون
# التشغيل **غير اختياري**. الاختبار الذي يُنسى في يوم ضاغط هو الاختبار الذي
# كان سيمسك العطب، ولا سبيل لمعرفة أنه لم يُشغَّل بعد أن تُرفع الشيفرة.
#
# ويندوز إلزامي لا تفضيل: لقطات الشاشة التسع والتسعون وُلِّدت على ويندوز،
# ورسم الخطوط يختلف بين المنصّات اختلافاً يجعلها كلها تفشل على لينكس —
# فشلٌ صحيحٌ تقنياً ولا يدلّ على شيء، فيُدرَّب صاحبه على تجاهل الأحمر.

name: الفحص

# الدفع إلى main وحده لا إلى كل فرع.
#
# ليس تهاوناً بل حساب: عدّاءات ويندوز المُستضافة تُحتسب بضعف الدقائق على
# المستودعات الخاصّة، وجولةٌ كاملة تقارب ربع الساعة. فتشغيلها عند كل دفعة
# على فرع عمل يستنفد الحصّة الشهرية في أيام، ثم تتوقّف البوّابة نفسها
# ساعةَ تلزم — عند الوسم.
#
# والفروع لا تبقى بلا فحص: كل وسم إصدار يستدعي هذا السير قبل البناء،
# ويمكن تشغيله يدوياً على أي فرع من Actions ← الفحص ← Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# دفعتان متتاليتان على نفس الفرع: الأقدم تُلغى. البناء يأخذ دقائق،
# ونتيجةُ شيفرةٍ استُبدلت لا تُقرأ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # النسخة مثبَّتة لا 'stable': ترقيةُ فلاتر تُغيّر رسم النصّ فتسقط
      # اللقطات كلها في صباحٍ لم يُلمس فيه الكود. والترقية تبقى ممكنة —
      # لكن بقرارٍ يُتخذ ويُختبر، لا بمفاجأة.
      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: جلب الاعتماديات
        run: flutter pub get

      - name: بناء الخادم
        run: dotnet build backend/KineticEnterprise.Api/KineticEnterprise.Api.csproj -c Release

      - name: التحليل الساكن
        run: flutter analyze lib

      - name: الاختبارات واللقطات
        run: flutter test

      # فشل لقطةٍ في السحابة بلا صورة هو سطرُ «اختلفت بنسبة ٠٫٤٪» وحده.
      # ملفات _diff تُظهر أين اختلفت بالضبط، وهي الفرق بين إصلاحٍ في دقيقة
      # وإعادة إنتاج الفشل محلياً بالتخمين.
      - name: رفع فروق اللقطات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/screenshots/failures/
          if-no-files-found: ignore
