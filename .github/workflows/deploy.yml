# النشر على الخادم — تجربةً ثم إنتاجاً، من نفس الحزمة.
#
# ما يحلّه: النشر اليدوي كان أربع خطوات على جهازين — يُبنى هنا، يُرفع عبر
# سطح المكتب البعيد، يُفكّ هناك، ثم يُنفَّذ deploy_update. وكل خطوة تُنسى
# أو تُنفَّذ على النسخة الخطأ، ولا أثر يقول أيّ نسخةٍ تعمل الآن أين.
#
# وهذا السير لا يبني شيئاً: يُنزّل **الحزمة المبنيّة نفسها** من الإصدار،
# فما يصل الإنتاج هو عين ما جُرِّب بايتاً ببايت — لا إعادة بناء «من نفس
# الشيفرة»، فذاك يُبطل التجربة كلّها.
#
# يعمل على عدّاءٍ مُستضاف ذاتياً على الخادم — راجع tool/runner_setup.ps1.

name: النشر

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'وسم الإصدار المراد نشره (مثال v1.2.0)'
        required: false
        type: string
      # ‏بديلٌ عن الوسم — للتجربة وحدها.
      #
      # ‏الوسم قرارٌ لا يُتخذ لتجربة شاشةٍ على خادم التجربة: يبقى في تاريخ
      # المستودع ويُعلن نسخةً للناس. فمن أراد تجربة بناءٍ لم يُوسم بعدُ كان
      # أمامه أن يوسم إصداراً لا ينوي إصداره، أو يرفع الحزمة بيده فيفقد كل
      # ما يحرسه ci_deploy — البصمة، وبوّابة الإنتاج، ونقطة التحديث.
      #
      # ‏ولا يبلغ الإنتاجَ أثرٌ أبداً: السكربت يرفضه هناك صراحةً.
      run_id:
        description: 'أو رقم سير «بناء حزمة النشر» (للتجربة وحدها)'
        required: false
        type: string
      version:
        description: 'رقم النسخة المُعلَن مع الأثر — بلاه لا يُخبَر جهازٌ بتحديث'
        required: false
        type: string
      target:
        description: 'الوجهة'
        required: true
        type: choice
        default: staging
        options: [staging, production]
      skip_db:
        description: 'تخطّي الترحيلات (نُفِّذت للتوّ)'
        type: boolean
        default: false
      mandatory_update:
        description: 'تحديث التطبيق إلزامي (يُستعمل حين يتغيّر عقد الـAPI)'
        type: boolean
        default: false
      skip_staging_check:
        description: 'تجاوز فحص التجربة (استخدام مؤقت)'
        type: boolean
        default: false

# نشرتان معاً على خادم واحد تتنازعان نفس الملفات المقفولة. الطابور لا
# الإلغاء: نشرةٌ تُلغى في منتصفها تترك ملفات نسختين مختلطة.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    # يعمل على عداء مُستضاف ذاتياً على الخادم
    runs-on: [self-hosted, kinetic]
    # يقرأ مرفَق الإصدار أو أثر السير، ولا يكتب شيئاً على GitHub.
    # وactions: read لازمة لقراءة الآثار — وبلاها يردّ 403 على وضع run_id
    # وحده، فيعمل النشر بالوسم ويسقط بالأثر بلا سببٍ ظاهر.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    environment: ${{ inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - name: النشر
        shell: powershell
        run: >
          .\tool\ci_deploy.ps1
          -Repo "${{ github.repository }}"
          -Tag "${{ inputs.tag }}"
          -RunId "${{ inputs.run_id }}"
          -Version "${{ inputs.version }}"
          -Target "${{ inputs.target }}"
          -Token "${{ github.token }}"
          -SkipDb:$${{ inputs.skip_db }}
          -MandatoryUpdate:$${{ inputs.mandatory_update }}
          -SkipStagingCheck:$${{ inputs.skip_staging_check }}
