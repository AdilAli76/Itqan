name: Build & Release Flutter App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.7.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze lib

      - name: Build web
        run: flutter build web --release

      - name: Build Android
        run: flutter build apk --debug

      - name: Package builds
        run: |
          mkdir -p build/output
          zip -r build/output/kinetic-web.zip build/web/
          cp build/app/outputs/apk/debug/app-debug.apk build/output/kinetic-android.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/output/kinetic-web.zip
            build/output/kinetic-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/output/kinetic-web.zip
            build/output/kinetic-android.apk
