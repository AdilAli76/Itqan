name: Build & Release Flutter App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.7.0)'
        required: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze lib

      - name: Build web
        run: flutter build web --release

      - name: Build windows
        run: flutter build windows --release

      - name: Package builds
        shell: pwsh
        run: |
          Compress-Archive -Path build/web/* -DestinationPath build/kinetic-web.zip -Force
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/kinetic-windows-x64.zip -Force

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/kinetic-web.zip
            build/kinetic-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/kinetic-web.zip
            build/kinetic-windows-x64.zip
