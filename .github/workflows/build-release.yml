# بناء حزمة النشر آلياً عند كل وسم إصدار.
#
# الغرض ليس الراحة بل التطابق: الحزمة تُبنى في بيئة نظيفة واحدة، فلا تختلف
# باختلاف جهاز من بناها ولا بما تبقّى في مجلداته من بناء سابق. وقد وقع ذلك
# فعلاً في هذا المشروع: مجلدات بناء قديمة أسقطت نسخة الويب من ماسح الباركود
# فخرجت حزمة تعمل ظاهرياً وفيها شاشة معطّلة.
#
# التشغيل:  git tag v1.2.0 && git push origin v1.2.0
# المخرَج:  publish.zip مرفقة بالإصدار على GitHub.

name: بناء حزمة النشر

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # ويندوز إلزامي لا تفضيل: الخادم يُنشر win-x64، والنشر المستقلّ عن
    # المنصّة يُنتج ملفات لا تعمل على IIS كما هو مضبوط.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: تهيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: جلب الاعتماديات
        run: flutter pub get

      - name: فحص التحليل الساكن
        run: flutter analyze lib

      # البناء النظيف مقصود: مجلدات .dart_tool المتبقّية هي ما يُسقط
      # تسجيل إضافات الويب من الحزمة بلا أي رسالة خطأ.
      - name: بناء الحزمة
        shell: pwsh
        run: |
          flutter clean
          flutter pub get
          .\tool\publish.ps1

      - name: بصمة الحزمة
        shell: pwsh
        run: |
          $h = (Get-FileHash publish.zip -Algorithm SHA256).Hash
          Write-Host "SHA256: $h"
          $h | Out-File publish.zip.sha256 -Encoding utf8

      - name: إرفاق بالإصدار
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish.zip
            publish.zip.sha256

      - name: حفظ الحزمة كأثر
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: |
            publish.zip
            publish.zip.sha256
