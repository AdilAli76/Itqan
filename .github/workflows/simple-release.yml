name: Create Release Simple

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.7.2)'
        required: true
      version:
        description: 'Version name'
        required: true

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag }}
          release_name: "الإصدار ${{ inputs.version }}"
          body: |
            # Kinetic ERP ${{ inputs.version }}

            ## Contents
            - kinetic-web.zip (Web build)
            - kinetic-app.apk (91.4 MB)
            - kinetic-app.aab (80.9 MB)

            ## Build Info
            - Build #56: Successful in 17m 28s
            - Date: 2026-09-11

            ## Deployment
            1. Download kinetic-web.zip
            2. Copy to /var/www/staging or /var/www/production
            3. Extract: unzip kinetic-web.zip
            4. Restart services

            ---
            Generated by Claude Code
          draft: false
          prerelease: false

      - name: Release Created
        run: |
          echo "✅ Release ${{ inputs.version }} created successfully!"
          echo "URL: ${{ steps.create_release.outputs.html_url }}"
