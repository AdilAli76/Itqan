name: CI - Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze lib

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK
        continue-on-error: true
        run: flutter build apk --release

      - name: Build Android App Bundle
        continue-on-error: true
        run: flutter build appbundle --release

      - name: Package builds
        shell: bash
        run: |
          mkdir -p build/output
          cd build/web && zip -r ../output/kinetic-web.zip . && cd ../..

          # Copy APK if it exists
          if [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk build/output/kinetic-app.apk
            echo "✅ APK packaged"
          elif [ -f build/app/outputs/flutter-app.apk ]; then
            cp build/app/outputs/flutter-app.apk build/output/kinetic-app.apk
            echo "✅ APK packaged"
          else
            echo "⚠️ APK not found - skipping"
          fi

          # Copy AAB if it exists
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab build/output/kinetic-app.aab
            echo "✅ AAB packaged"
          else
            echo "⚠️ AAB not found - skipping"
          fi

          echo "✅ Web build packaged"
          ls -lh build/output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/output/
          retention-days: 7
