name: kinetic_enterprise
description: منظومة إتقان ERP - النسخة التجارية العربية المتكاملة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # مسارات الويب بلا # — راجع usePathUrlStrategy في main.dart.
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  signalr_netcore: ^1.3.7
  flutter_secure_storage: ^10.0.0
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.68.0
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  barcode: ^2.2.9
  pdf: ^3.13.0
  printing: ^5.15.0
  # 12.x هي الإعادة التي تدعم AGP 9: النسخة 11 تثبّت Kotlin 1.8.22 في نصّها
  # فلا يطبّقها AGP 9، ولا تُنشأ لوحدتها مهمة تصريف Kotlin أصلاً — فيفشل
  # javac التطبيق بـ«cannot find symbol: FilePickerPlugin».
  file_picker: ^12.1.0
  mobile_scanner: ^7.4.0
  audioplayers: ^6.8.1
  # 10.x مطلوبة مع file_picker 12: الأخيرة تحتاج win32 ^6.3.0 بينما
  # package_info_plus 9 تثبّت win32 ^5.5.3، فيتعذّر حلّ التبعيات.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # الخط مضمَّن لا مُنزَّل وقت التشغيل.
    #
    # كان المشروع يعتمد على google_fonts بالجلب الشبكي، وهو خيار خاطئ لهذا
    # النظام تحديداً: يُنشَر على خادم داخل متجر (راجع DEPLOYMENT.md)، فأول
    # تشغيل بلا إنترنت يسقط إلى خط النظام الافتراضي — وتظهر الواجهة العربية
    # بخط مختلف عن المُصمَّم لها. وعلى الأندرويد الأثر أوضح.
    #
    # والتضمين يحلّ أيضاً تعذّر توليد لقطات الشاشة في الاختبارات: بلا خط
    # حقيقي يرسم flutter test كل حرف مربّعاً فارغاً.
    #
    # الكلفة 884 كيلوبايت لأربعة أوزان — ثمن زهيد مقابل استقلال عن الشبكة.
    # الرخصة OFL وتسمح بإعادة التوزيع.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

  # نغمات نقطة البيع — ملفات WAV صغيرة مضمَّنة في الحزمة لا مُنزَّلة.
  #
  # الكاشير ينظر إلى الزبون لا إلى الشاشة، فالتأكيد المسموع هو ما يمنع مسح
  # الصنف مرّتين أو ظنّ أن مسحةً نجحت وهي فشلت. وتضمينها شرط لا تحسين:
  # جهاز نقطة بيع قد يعمل بلا إنترنت، وصوت لا يُسمع إلا بالشبكة لا يُعتمد
  # عليه.
  assets:
    - assets/sounds/
    - assets/branding/

  #
  # كان هنا إعلان assets/icons/ لمجلد غير موجود ولا يشير إليه أي كود، فكان
  # Flutter يطبع خطأً مع كل أمر build وtest ("unable to find directory
  # entry"). والمجلد لم يكن متتبَّعاً في Git أصلاً — Git لا يحفظ المجلدات
  # الفارغة — فلم يكن موجوداً لدى أي شخص يستنسخ المستودع.
  #
  # عند تضمين خط IBM Plex Sans Arabic لاحقاً (بدل تنزيله من Google وقت
  # التشغيل) يُضاف هنا قسم fonts: لا assets:.
